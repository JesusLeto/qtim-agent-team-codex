name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JSON-манифесты валидны
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
          python3 -m json.tool plugins/qtim/.codex-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/qtim/hooks/hooks.json > /dev/null
          python3 -m json.tool plugins/qtim/reference/project-hooks.json > /dev/null

      - name: Codex-native runtime — Claude-only примитивы запрещены
        run: |
          test ! -e .claude-plugin
          test ! -e plugins/qtim/.claude-plugin
          test ! -d plugins/qtim/commands
          if grep -rnE 'TeamCreate\(|TeamDelete\(|team_name\s*:|CLAUDE_PLUGIN_ROOT' plugins/qtim README.md AGENTS.md; then
            echo 'Найден Claude-only call-синтаксис или plugin-root token в Codex-native версии' >&2
            exit 1
          fi
          echo 'OK: Claude-only артефакты и call-синтаксис не встречаются'

      - name: Плейсхолдеры шаблонов из белого списка
        run: python3 .github/scripts/check_placeholders.py

      - name: Codex hooks schema и output contract валидны
        run: python3 .github/scripts/check_hooks.py

      - name: Frontmatter skills валиден
        run: |
          python3 -m pip install --quiet pyyaml || true
          python3 .github/scripts/check_skills.py

      - name: Ссылки на qtim skills резолвятся
        run: |
          python3 .github/scripts/check_skill_refs.py
          python3 .github/scripts/check_skill_refs.py --self-test

      - name: Mission contracts и semantic fixtures валидны
        run: python3 .github/scripts/check_missions.py

      - name: Codex custom agents валидны
        run: python3 .github/scripts/check_codex_agents.py

      - name: Generated-state migrations не забыты
        env:
          CHECK_MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check_migrations.py

      - name: Extended/custom-role migration fixture валиден
        run: |
          python3 .github/scripts/check_update_fixtures.py
          python3 .github/scripts/check_update_fixtures.py --self-test

      - name: Semantic golden project валиден
        run: python3 .github/scripts/check_golden.py

      - name: Knowledge scanner запускается на текущем Git base
        run: python3 plugins/qtim/skills/qtim-kb-refresh/scripts/kb_scan.py scan --base HEAD > /dev/null

      - name: Относительные ссылки в plugins/ не биты
        run: python3 .github/scripts/check_links.py

  validate-windows-hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Windows commandWindows hooks исполняются
        run: python .github/scripts/check_hooks.py

      - name: Windows junction containment mission валиден
        run: python .github/scripts/check_missions.py --windows-filesystem-only
